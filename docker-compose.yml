services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catalog_db}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6380:6379"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: ${POSTGRES_PASSWORD:-change-me-in-production}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5673:5672"
      - "15673:15672"

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sabr-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-root-password-change-me}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sabr-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-root-password-change-me}
      MINIO_MEDIA_ACCESS_KEY: ${MINIO_MEDIA_ACCESS_KEY:-sabr-media-service}
      MINIO_MEDIA_SECRET_KEY: ${MINIO_MEDIA_SECRET_KEY:-local-media-service-password-change-me}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/sabr-product-media
        mc anonymous set-json /config/public-read-policy.json local/sabr-product-media
        mc admin user add local "$${MINIO_MEDIA_ACCESS_KEY}" "$${MINIO_MEDIA_SECRET_KEY}" || true
        mc admin policy create local media-rw /config/media-policy.json || true
        mc admin policy attach local media-rw --user "$${MINIO_MEDIA_ACCESS_KEY}"
        mc cp --recursive /seed/ local/sabr-product-media/products/
    volumes:
      - ./infra/minio/media-policy.json:/config/media-policy.json:ro
      - ./infra/minio/public-read-policy.json:/config/public-read-policy.json:ro
      - ./infra/minio/seed/products:/seed:ro
    depends_on:
      minio:
        condition: service_healthy

  catalog-api:
    build:
      context: ./services/catalog-service
    environment:
      DATABASE_URL: ${CATALOG_DATABASE_URL:-postgresql+asyncpg://app:change-me-in-production@postgres:5432/catalog_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://app:change-me-in-production@rabbitmq:5672/}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:9000/sabr-product-media}
    volumes:
      - ./services/catalog-service:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8101:8000"

  media-api:
    build:
      context: ./services/media-service
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_MEDIA_ACCESS_KEY:-sabr-media-service}
      MINIO_SECRET_KEY: ${MINIO_MEDIA_SECRET_KEY:-local-media-service-password-change-me}
      MINIO_BUCKET: sabr-product-media
      MINIO_SECURE: "false"
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:9000/sabr-product-media}
      AUTH_ME_URL: http://auth-api:8000/api/v1/auth/me
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
    depends_on:
      minio-init:
        condition: service_completed_successfully
      auth-api:
        condition: service_started
    ports:
      - "8104:8000"

  auth-api:
    build:
      context: ./services/auth-service
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql+asyncpg://app:change-me-in-production@postgres:5432/auth_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://app:change-me-in-production@rabbitmq:5672/}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-in-production}
      OTP_SECRET: ${OTP_SECRET:-dev-only-otp-secret-change-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL-admin@example.com}
    volumes:
      - ./services/auth-service:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8102:8000"

  notification-worker:
    build:
      context: ./services/notification-worker
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://app:change-me-in-production@rabbitmq:5672/}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: "${EMAIL_FROM:-SABR <login@example.com>}"
    volumes:
      - ./services/notification-worker:/app
    depends_on:
      rabbitmq:
        condition: service_healthy

  orders-api:
    build:
      context: ./services/order-service
    environment:
      DATABASE_URL: ${ORDERS_DATABASE_URL:-postgresql+asyncpg://app:change-me-in-production@postgres:5432/orders_db}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://app:change-me-in-production@rabbitmq:5672/}
      AUTH_ME_URL: http://auth-api:8000/api/v1/auth/me
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
    volumes:
      - ./services/order-service:/app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-api:
        condition: service_started
    ports:
      - "8103:8000"

  storefront:
    build:
      context: ./frontend
      args:
        VITE_AUTH_API_URL: ${STOREFRONT_AUTH_API_URL:-http://localhost:8102/api/v1/auth}
        VITE_CATALOG_API_URL: ${STOREFRONT_CATALOG_API_URL:-http://localhost:8101/api/v1/catalog}
        VITE_ORDERS_API_URL: ${STOREFRONT_ORDERS_API_URL:-http://localhost:8103/api/v1/orders}
        VITE_MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:9000/sabr-product-media}
    depends_on:
      - auth-api
      - catalog-api
      - orders-api
      - minio-init
    restart: unless-stopped
    ports:
      - "5173:80"

  admin-frontend:
    build:
      context: ./admin-frontend
      args:
        VITE_AUTH_API_URL: ${ADMIN_AUTH_API_URL:-http://localhost:8102/api/v1/auth}
        VITE_CATALOG_ADMIN_API_URL: ${ADMIN_CATALOG_API_URL:-http://localhost:8101/api/v1/admin/catalog}
        VITE_ORDERS_ADMIN_API_URL: ${ADMIN_ORDERS_API_URL:-http://localhost:8103/api/v1/admin/orders}
        VITE_MEDIA_API_URL: ${ADMIN_MEDIA_API_URL:-http://localhost:8104/api/v1/media}
    depends_on:
      - auth-api
      - catalog-api
      - orders-api
      - media-api
    restart: unless-stopped
    ports:
      - "5174:80"

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
